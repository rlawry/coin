<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Coin Toss</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Atkinson+Hyperlegible:wght@400;700&display=swap" rel="stylesheet">
<style>
  :root {
    --bg: #1c2233;
    --bg-edge: #121625;
    --purple: #b98bff;
    --yellow: #ffd23f;
    --green: #5fe08a;
    --cyan: #6fd3ff;
    --gold-light: #f5d98a;
    --gold: #d9a93a;
    --gold-dark: #9c7320;
    --ink: #3d2a05;
    --button: #ffffff;
    --button-ink: #1c2233;
    box-sizing: border-box;
    padding-top: env(safe-area-inset-top, 0px);
    padding-bottom: env(safe-area-inset-bottom, 0px);
  }
  *, *::before, *::after { box-sizing: inherit; }
  html, body { height: 100%; margin: 0; }
  body {
    background: radial-gradient(circle at 50% 50%, var(--bg) 40%, var(--bg-edge) 100%);
    background-color: var(--bg);
    font-family: "Atkinson Hyperlegible", "Verdana", "Segoe UI", sans-serif;
    overflow: hidden;
    position: relative;
  }

  #result {
    position: absolute;
    left: 50%;
    top: 20%;
    transform: translate(-50%, -50%) scale(0.8);
    margin: 0;
    font-weight: 700;
    font-size: clamp(3rem, 12vw, 7rem);
    letter-spacing: 0.04em;
    line-height: 1;
    opacity: 0;
    transition: opacity 0.25s ease, transform 0.35s cubic-bezier(.3,1.6,.5,1);
    white-space: nowrap;
  }
  #result.show { opacity: 1; transform: translate(-50%, -50%) scale(1); }

  .stage {
    position: absolute;
    left: 50%;
    top: 47%;
    --size: clamp(130px, 28vmin, 230px);
    width: var(--size);
    height: var(--size);
    transform: translate(-50%, -50%);
    perspective: 900px;
  }
  .shadow {
    position: absolute;
    left: 10%;
    right: 10%;
    bottom: -18%;
    height: 12%;
    border-radius: 50%;
    background: rgba(0, 0, 0, 0.45);
    filter: blur(6px);
  }
  .jumper { width: 100%; height: 100%; }
  .coin {
    position: relative;
    width: 100%;
    height: 100%;
    transform-style: preserve-3d;
  }
  .face {
    position: absolute;
    inset: 0;
    backface-visibility: hidden;
    -webkit-backface-visibility: hidden;
    display: grid;
    place-items: center;
    background: radial-gradient(circle at 35% 30%, var(--gold-light) 0%, var(--gold) 55%, var(--gold-dark) 100%);
    box-shadow:
      inset 0 0 0 calc(var(--size) * 0.045) var(--gold-dark),
      inset 0 0 0 calc(var(--size) * 0.07) var(--gold-light);
  }
  .coin.round .face { border-radius: 50%; }
  .coin.prism .face { border-radius: 14%; }
  .face span {
    font-weight: 700;
    font-size: calc(var(--size) * 0.5);
    line-height: 1;
    color: var(--ink);
    text-shadow: 0 2px 0 var(--gold-light);
  }

  #flip {
    position: absolute;
    left: 50%;
    top: 74%;
    transform: translate(-50%, -50%);
    font-family: inherit;
    font-weight: 700;
    font-size: clamp(1.25rem, 4vw, 1.75rem);
    padding: 0.7em 1.8em;
    border: none;
    border-radius: 999px;
    background: var(--button);
    color: var(--button-ink);
    cursor: pointer;
    box-shadow: 0 6px 0 #9aa3bd;
    transition: transform 0.08s ease, box-shadow 0.08s ease, opacity 0.2s;
  }
  #flip:active:not(:disabled) {
    transform: translate(-50%, calc(-50% + 4px));
    box-shadow: 0 2px 0 #9aa3bd;
  }

  .sides {
    position: absolute;
    left: 50%;
    top: 88%;
    transform: translate(-50%, -50%);
    display: flex;
    gap: 0.4rem;
    padding: 0.35rem;
    border-radius: 999px;
    background: rgba(255, 255, 255, 0.08);
    border: 0;
    margin: 0;
  }
  .sides legend {
    position: absolute;
    width: 1px; height: 1px;
    overflow: hidden;
    clip: rect(0 0 0 0);
  }
  .sides label {
    position: relative;
    cursor: pointer;
  }
  .sides input {
    position: absolute;
    opacity: 0;
    inset: 0;
    margin: 0;
    cursor: pointer;
  }
  .sides span {
    display: block;
    padding: 0.5em 1.1em;
    border-radius: 999px;
    color: #d6dbe8;
    font-weight: 700;
    font-size: clamp(0.95rem, 2.8vw, 1.15rem);
    white-space: nowrap;
  }
  .sides input:checked + span { background: #ffffff; color: var(--button-ink); }
  .sides input:disabled + span { opacity: 0.6; }

  #flip:focus-visible,
  .sides input:focus-visible + span { outline: 4px solid var(--yellow); outline-offset: 3px; }
</style>
</head>
<body>
  <h1 id="result" aria-live="polite"></h1>

  <div class="stage" aria-hidden="true">
    <div class="shadow" id="shadow"></div>
    <div class="jumper" id="jumper">
      <div class="coin round" id="coin"></div>
    </div>
  </div>

  <button id="flip" type="button">Flip Coin</button>

  <fieldset class="sides" id="sides">
    <legend>Number of sides</legend>
    <label><input type="radio" name="sides" value="2" checked><span>2 sides</span></label>
    <label><input type="radio" name="sides" value="3"><span>3 sides</span></label>
    <label><input type="radio" name="sides" value="4"><span>4 sides</span></label>
  </fieldset>

<script>
  // Every side: the word shown above the coin, its color, and the mark on the coin face.
  const SIDES = [
    { word: 'HEADS', color: 'var(--purple)', mark: 'H' },
    { word: 'TAILS', color: 'var(--yellow)', mark: 'T' },
    { word: 'STARS', color: 'var(--green)',  mark: '★' },
    { word: 'MOONS', color: 'var(--cyan)',   mark: '☾' }
  ];

  const coin = document.getElementById('coin');
  const jumper = document.getElementById('jumper');
  const shadow = document.getElementById('shadow');
  const result = document.getElementById('result');
  const button = document.getElementById('flip');
  const radios = document.querySelectorAll('input[name="sides"]');

  const reduceMotion = window.matchMedia('(prefers-reduced-motion: reduce)').matches;
  let sideCount = 2;
  let rotation = 0;
  let currentAnim = null;

  function buildCoin(n) {
    sideCount = n;
    coin.innerHTML = '';
    coin.className = 'coin ' + (n === 2 ? 'round' : 'prism');
    if (currentAnim) currentAnim.cancel();
    rotation = 0;
    coin.style.transform = 'rotateX(0deg)';
    result.classList.remove('show');

    const size = coin.getBoundingClientRect().height || 200;
    const step = 360 / n;
    // Distance from the center of the coin out to each face.
    // A flat coin is thin; a 3- or 4-sided coin is a prism that rolls.
    const depth = n === 2 ? 3 : size / (2 * Math.tan(Math.PI / n));

    for (let i = 0; i < n; i++) {
      const face = document.createElement('div');
      face.className = 'face';
      face.style.transform = `rotateX(${i * step}deg) translateZ(${depth}px)`;
      const mark = document.createElement('span');
      mark.textContent = SIDES[i].mark;
      face.appendChild(mark);
      coin.appendChild(face);
    }
  }

  function randomIndex(n) {
    // Unbiased random integer from 0 to n-1
    const arr = new Uint32Array(1);
    const limit = Math.floor(0x100000000 / n) * n;
    do { crypto.getRandomValues(arr); } while (arr[0] >= limit);
    return arr[0] % n;
  }

  radios.forEach(r => r.addEventListener('change', () => buildCoin(Number(r.value))));
  window.addEventListener('resize', () => buildCoin(sideCount));

  button.addEventListener('click', () => {
    button.disabled = true;
    radios.forEach(r => r.disabled = true);
    result.classList.remove('show');

    const n = sideCount;
    const pick = randomIndex(n);
    const side = SIDES[pick];
    const step = 360 / n;
    const duration = reduceMotion ? 400 : 1600;
    const spins = reduceMotion ? 1 : 5 + Math.floor(Math.random() * 3);

    // Spin forward several full turns, then stop with the chosen face toward the viewer.
    const base = Math.ceil(rotation / 360) * 360 + spins * 360;
    const target = base + pick * step;

    currentAnim = coin.animate(
      [{ transform: `rotateX(${-rotation}deg)` }, { transform: `rotateX(${-target}deg)` }],
      { duration, easing: 'cubic-bezier(.25,.6,.35,1)', fill: 'forwards' }
    );

    const height = reduceMotion ? '0px' : 'min(-34vh, -160px)';
    jumper.animate(
      [
        { transform: 'translateY(0)', easing: 'cubic-bezier(.2,.7,.4,1)' },
        { transform: `translateY(${height})`, offset: 0.45, easing: 'cubic-bezier(.6,0,.8,.3)' },
        { transform: 'translateY(0)', offset: 0.88 },
        { transform: 'translateY(-10px)', offset: 0.94 },
        { transform: 'translateY(0)' }
      ],
      { duration }
    );

    shadow.animate(
      [
        { transform: 'scale(1)', opacity: 1 },
        { transform: 'scale(0.45)', opacity: 0.35, offset: 0.45 },
        { transform: 'scale(1)', opacity: 1, offset: 0.88 },
        { transform: 'scale(1)', opacity: 1 }
      ],
      { duration }
    );

    rotation = target;

    setTimeout(() => {
      result.textContent = side.word;
      result.style.color = side.color;
      result.classList.add('show');
      button.disabled = false;
      radios.forEach(r => r.disabled = false);
      button.focus();
    }, duration);
  });

  buildCoin(2);
</script>
</body>
</html>
